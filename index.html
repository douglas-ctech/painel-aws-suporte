<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Diário - Suporte</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc;
            color: #0f172a;
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- Header -->
        <header class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                        <span class="text-amber-500">⚡</span> Checklist Diário de Ambientes
                    </h1>
                    <p class="text-slate-500 text-sm mt-1">Rotina de reinicialização de servidores Azure e AWS</p>
                </div>
                <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Data</label>
                        <input type="date" id="checkDate" class="bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Responsável</label>
                        <input type="text" id="respName" placeholder="Seu nome" class="bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:border-amber-500">
                    </div>
                </div>
            </div>
            <!-- Progress Bar -->
            <div class="mt-6">
                <div class="flex justify-between text-sm mb-1">
                    <span class="text-slate-600 font-medium">Progresso Geral</span>
                    <span id="progressText" class="text-amber-600 font-semibold">0%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden border border-slate-200">
                    <div id="progressBar" class="bg-amber-500 h-2.5 transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </header>

        <!-- Main Form -->
        <main class="space-y-6">
            
            <!-- Azure Section -->
            <section class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                <div class="flex items-center justify-between mb-6 border-b border-slate-100 pb-3">
                    <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> Servidores Azure
                    </h2>
                    <span class="text-xs font-semibold bg-blue-50 text-blue-700 px-3 py-1 rounded-full border border-blue-200">3 TCP • 2 HTTPS</span>
                </div>
                <div id="azureContainer" class="space-y-4"></div>
            </section>

            <!-- AWS Section -->
            <section class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                <div class="flex items-center justify-between mb-6 border-b border-slate-100 pb-3">
                    <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Ambientes AWS
                    </h2>
                    <span class="text-xs font-semibold bg-amber-50 text-amber-700 px-3 py-1 rounded-full border border-amber-200">7 Ambientes</span>
                </div>
                <div id="awsContainer" class="space-y-4"></div>
            </section>

            <!-- Observations -->
            <section class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                <h2 class="text-lg font-bold text-slate-900 mb-2">📝 Observações / Ocorrências</h2>
                <textarea id="observations" rows="3" placeholder="Registre aqui se houve falhas, lentidão ou comportamento atípico..." class="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm text-slate-800 focus:outline-none focus:border-amber-500"></textarea>
            </section>

            <!-- Actions -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-2">
                <button onclick="resetChecklist()" class="w-full sm:w-auto px-5 py-2.5 rounded-xl border border-red-200 text-red-600 hover:bg-red-50 text-sm font-semibold transition">
                    Limpar Checklist
                </button>
                <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                    <button onclick="saveToHistory()" class="w-full sm:w-auto px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-sm shadow-sm transition">
                        💾 Salvar no Histórico
                    </button>
                    <button onclick="exportToExcel()" class="w-full sm:w-auto flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-sm shadow-sm transition">
                        <span>📊</span> Baixar Excel
                    </button>
                </div>
            </div>

            <!-- History Section (Agenda) -->
            <section class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm mt-10">
                <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-3">
                    <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <span>📅</span> Histórico / Agenda de Execuções Salvas
                    </h2>
                    <button onclick="clearHistory()" class="text-xs text-red-500 hover:text-red-700 font-medium">Limpar Histórico</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-600 border-b border-slate-200">
                            <tr>
                                <th class="p-3">Data</th>
                                <th class="p-3">Responsável</th>
                                <th class="p-3">Progresso</th>
                                <th class="p-3">Observações</th>
                                <th class="p-3 text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody" class="divide-y divide-slate-100 text-slate-700">
                            <!-- Preenchido via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script>
        const azureServers = [
            { name: "Servidor TCP 1", ip: "172.18.0.81", type: "TCP" },
            { name: "Servidor TCP 2", ip: "172.18.0.82", type: "TCP" },
            { name: "Servidor TCP 3", ip: "172.18.0.83", type: "TCP" },
            { name: "Servidor HTTPS 1", ip: "172.27.233.70", type: "HTTPS" },
            { name: "Servidor HTTPS 2", ip: "172.27.233.71", type: "HTTPS" }
        ];

        const awsEnvironments = [
            "Softcom", "Procfit", "Elgin", "Compartilhado", "Arius", "MultiplusCard", "Linear Sistemas"
        ];

        const azureSteps = [
            "Sincronismo offline no PSW",
            "Bloquear PDVs",
            "Encerrar aplicação",
            "Executar aplicação como admin",
            "Contratos carregados"
        ];

        const awsSteps = [
            "Sincronismo offline no PSW",
            "Silenciar PDVs na console",
            "Parar/subir serviços do SCOPE no services.msc",
            "Aguardar PDVs voltarem na console"
        ];

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("checkDate").valueAsDate = new Date();
            renderAzure();
            renderAWS();
            updateProgress();
            loadHistory();
        });

        function renderAzure() {
            const container = document.getElementById("azureContainer");
            container.innerHTML = "";
            azureServers.forEach((srv, srvIdx) => {
                let stepsHtml = azureSteps.map((step, stepIdx) => `
                    <label class="flex items-center justify-between p-2.5 rounded-lg bg-slate-50 border border-slate-200 hover:border-slate-300 cursor-pointer select-none transition">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" data-group="azure" data-server="${srvIdx}" data-step="${stepIdx}" onchange="updateProgress()" class="w-4 h-4 rounded border-slate-300 text-amber-500 focus:ring-amber-500">
                            <span class="text-sm text-slate-700 font-medium">${step}</span>
                        </div>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-white text-slate-500 border border-slate-200">${srv.type}</span>
                    </label>
                `).join('');

                container.innerHTML += `
                    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                        <div class="flex items-center justify-between mb-3 border-b border-slate-100 pb-2">
                            <span class="font-bold text-slate-800 text-sm flex items-center gap-2">
                                <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span> ${srv.name} <span class="text-xs text-slate-400 font-mono font-normal">(${srv.ip})</span>
                            </span>
                            <span class="text-xs text-slate-400 font-mono">Azure</span>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
                            ${stepsHtml}
                        </div>
                    </div>
                `;
            });
        }

        function renderAWS() {
            const container = document.getElementById("awsContainer");
            container.innerHTML = "";
            awsEnvironments.forEach((env, envIdx) => {
                let stepsHtml = awsSteps.map((step, stepIdx) => `
                    <label class="flex items-center justify-between p-2.5 rounded-lg bg-slate-50 border border-slate-200 hover:border-slate-300 cursor-pointer select-none transition">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" data-group="aws" data-env="${envIdx}" data-step="${stepIdx}" onchange="updateProgress()" class="w-4 h-4 rounded border-slate-300 text-amber-500 focus:ring-amber-500">
                            <span class="text-sm text-slate-700 font-medium">${step}</span>
                        </div>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-white text-slate-500 border border-slate-200">AWS</span>
                    </label>
                `).join('');

                container.innerHTML += `
                    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                        <div class="flex items-center justify-between mb-3 border-b border-slate-100 pb-2">
                            <span class="font-bold text-slate-800 text-sm flex items-center gap-2">
                                <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> Ambiente - ${env}
                            </span>
                            <span class="text-xs text-slate-400 font-mono">AWS</span>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 gap-2.5">
                            ${stepsHtml}
                        </div>
                    </div>
                `;
            });
        }

        function updateProgress() {
            const checkboxes = document.querySelectorAll("input[type='checkbox']");
            const total = checkboxes.length;
            let checked = 0;
            checkboxes.forEach(cb => { if (cb.checked) checked++; });
            const percent = Math.round((checked / total) * 100);
            
            document.getElementById("progressText").innerText = percent + "%";
            document.getElementById("progressBar").style.width = percent + "%";
            return percent;
        }

        function resetChecklist() {
            if (confirm("Deseja realmente limpar todas as marcações?")) {
                document.querySelectorAll("input[type='checkbox']").forEach(cb => cb.checked = false);
                document.getElementById("observations").value = "";
                updateProgress();
            }
        }

        function getChecklistState() {
            let state = { azure: {}, aws: {} };
            azureServers.forEach((srv, srvIdx) => {
                state.azure[srvIdx] = {};
                azureSteps.forEach((step, stepIdx) => {
                    const cb = document.querySelector(`input[data-group="azure"][data-server="${srvIdx}"][data-step="${stepIdx}"]`);
                    state.azure[srvIdx][stepIdx] = cb ? cb.checked : false;
                });
            });
            awsEnvironments.forEach((env, envIdx) => {
                state.aws[envIdx] = {};
                awsSteps.forEach((step, stepIdx) => {
                    const cb = document.querySelector(`input[data-group="aws"][data-env="${envIdx}"][data-step="${stepIdx}"]`);
                    state.aws[envIdx][stepIdx] = cb ? cb.checked : false;
                });
            });
            return state;
        }

        function saveToHistory() {
            const date = document.getElementById("checkDate").value;
            const resp = document.getElementById("respName").value || "Não informado";
            const obs = document.getElementById("observations").value || "";
            const percent = updateProgress();

            if (!date) {
                alert("Por favor, informe a data.");
                return;
            }

            const record = {
                id: Date.now(),
                date,
                resp,
                percent,
                obs,
                state: getChecklistState()
            };

            let history = JSON.parse(localStorage.getItem("checklist_history") || "[]");
            history = history.filter(item => item.date !== date);
            history.unshift(record);

            localStorage.setItem("checklist_history", JSON.stringify(history));
            loadHistory();
            alert("Checklist salvo no histórico com sucesso!");
        }

        function loadHistory() {
            const tbody = document.getElementById("historyTableBody");
            let history = JSON.parse(localStorage.getItem("checklist_history") || "[]");
            
            if (history.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">Nenhum registro salvo no histórico ainda.</td></tr>`;
                return;
            }

            tbody.innerHTML = "";
            history.forEach(item => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3 font-medium">${item.date}</td>
                        <td class="p-3">${item.resp}</td>
                        <td class="p-3">
                            <span class="px-2 py-0.5 rounded text-xs font-semibold ${item.percent === 100 ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-amber-50 text-amber-700 border border-amber-200'}">
                                ${item.percent}%
                            </span>
                        </td>
                        <td class="p-3 text-slate-500 truncate max-w-xs">${item.obs || '-'}</td>
                        <td class="p-3 text-right space-x-2">
                            <button onclick="loadRecord(${item.id})" class="text-blue-600 hover:text-blue-800 text-xs font-semibold">Carregar</button>
                            <button onclick="deleteRecord(${item.id})" class="text-red-500 hover:text-red-700 text-xs">Excluir</button>
                        </td>
                    </tr>
                `;
            });
        }

        function loadRecord(id) {
            let history = JSON.parse(localStorage.getItem("checklist_history") || "[]");
            let record = history.find(item => item.id === id);
            if (!record) return;

            document.getElementById("checkDate").value = record.date;
            document.getElementById("respName").value = record.resp;
            document.getElementById("observations").value = record.obs;

            for (let srvIdx in record.state.azure) {
                for (let stepIdx in record.state.azure[srvIdx]) {
                    let cb = document.querySelector(`input[data-group="azure"][data-server="${srvIdx}"][data-step="${stepIdx}"]`);
                    if (cb) cb.checked = record.state.azure[srvIdx][stepIdx];
                }
            }
            for (let envIdx in record.state.aws) {
                for (let stepIdx in record.state.aws[envIdx]) {
                    let cb = document.querySelector(`input[data-group="aws"][data-env="${envIdx}"][data-step="${stepIdx}"]`);
                    if (cb) cb.checked = record.state.aws[envIdx][stepIdx];
                }
            }
            updateProgress();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteRecord(id) {
            if (confirm("Deseja remover este registro do histórico?")) {
                let history = JSON.parse(localStorage.getItem("checklist_history") || "[]");
                history = history.filter(item => item.id !== id);
                localStorage.setItem("checklist_history", JSON.stringify(history));
                loadHistory();
            }
        }

        function clearHistory() {
            if (confirm("Deseja apagar todo o histórico de execuções?")) {
                localStorage.removeItem("checklist_history");
                loadHistory();
            }
        }

        function exportToExcel() {
            const date = document.getElementById("checkDate").value || "Data não informada";
            const resp = document.getElementById("respName").value || "Não informado";
            const obs = document.getElementById("observations").value || "Nenhuma observação registrada.";

            let excelData = [
                ["CHECKLIST DIÁRIO DE REINICIALIZAÇÃO DE AMBIENTES"],
                ["Data:", date, "Responsável:", resp],
                [],
                ["--- SERVIDORES AZURE ---"],
                ["Servidor", "IP", "Tipo", "Passo da Rotina", "Status"]
            ];

            azureServers.forEach((srv, srvIdx) => {
                azureSteps.forEach((step, stepIdx) => {
                    const cb = document.querySelector(`input[data-group="azure"][data-server="${srvIdx}"][data-step="${stepIdx}"]`);
                    excelData.push([srv.name, srv.ip, srv.type, step, cb && cb.checked ? "CONCLUÍDO" : "PENDENTE"]);
                });
            });

            excelData.push([]);
            excelData.push(["--- AMBIENTES AWS ---"]);
            excelData.push(["Ambiente", "Passo da Rotina", "Status", ""]);

            awsEnvironments.forEach((env, envIdx) => {
                awsSteps.forEach((step, stepIdx) => {
                    const cb = document.querySelector(`input[data-group="aws"][data-env="${envIdx}"][data-step="${stepIdx}"]`);
                    excelData.push([env, step, cb && cb.checked ? "CONCLUÍDO" : "PENDENTE", ""]);
                });
            });

            excelData.push([]);
            excelData.push(["--- OBSERVAÇÕES ---"]);
            excelData.push([obs]);

            const ws = XLSX.utils.aoa_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Checklist Diário");

            XLSX.writeFile(wb, `Checklist_Ambientes_${date}.xlsx`);
        }
    </script>
</body>
</html>
